name: CI Read-only

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-readonly:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.14.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.5"
      - name: Verify locked supply chain
        run: 'python -m pip install --dry-run --ignore-installed --only-binary=:all: --require-hashes --no-cache-dir -r requirements.lock'
      - name: Read-only syntax lint
        run: python scripts/ops/lint_readonly.py --compact
